# ─────────────────────────────────────────────────────────────────────────────
# 3Knot Matrimony — Nginx reverse proxy
# Install: cp this to /etc/nginx/sites-available/matrimony-backend
#          ln -s /etc/nginx/sites-available/matrimony-backend /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS (Certbot will modify this block automatically)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # SSL certificates — Certbot will fill these in automatically.
    # If running without certbot initially, comment out the ssl_certificate lines
    # and use the port-80 block above.
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Request size limit (matches backend's MAX_UPLOAD_BYTES + overhead)
    client_max_body_size 10M;

    # Gzip for API JSON responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # ── WebSocket: /ws ───────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket alive — don't time out idle connections too quickly
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API routes: /api/* ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for long-running requests (file uploads, data exports)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Web app (static files served by Node) ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Deny access to dotfiles ──────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

