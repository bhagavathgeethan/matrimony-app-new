<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sangam — Where two lives meet</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        min-height: 100%;
      }
      body {
        background-color: #F3EDE3;
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #23140F;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      button, a, input, textarea {
        font-family: inherit;
      }
      input:focus, textarea:focus {
        outline: none;
      }

      /* Entrance animation used by <FadeIn> */
      @keyframes mx-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .mx-fade {
        animation: mx-fade-up 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes mx-pulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }
      .mx-pulse {
        animation: mx-pulse 3.2s ease-in-out infinite;
      }
      /* Logo: strands draw in, then the bindu pops */
      .mx-draw path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: mx-draw 1100ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .mx-draw path:nth-of-type(2) { animation-delay: 120ms; }
      @keyframes mx-draw { to { stroke-dashoffset: 0; } }
      .mx-draw .mx-bindu {
        transform-origin: 60px 58px;
        transform: scale(0);
        animation: mx-pop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) 950ms forwards;
      }
      @keyframes mx-pop { to { transform: scale(1); } }
      /* Indeterminate progress bar */
      .mx-shimmer {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(201,162,92,0), #E3C68A, rgba(201,162,92,0));
        animation: mx-shimmer 1.2s ease-in-out infinite;
      }
      @keyframes mx-shimmer {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mx-fade, .mx-pulse, .mx-shimmer { animation: none; }
        .mx-draw path { animation: none; stroke-dashoffset: 0; }
        .mx-draw .mx-bindu { animation: none; transform: none; }
      }

      /* Blueprint pillar slider */
      .mx-range {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 28px;
        background: transparent;
        cursor: pointer;
        margin: 0;
      }
      .mx-range::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 99px;
        background: transparent;
      }
      .mx-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 26px;
        height: 26px;
        margin-top: -10px;
        border-radius: 50%;
        background: #FFFFFF;
        border: 7px solid #A81E3C;
        box-shadow: 0 4px 14px rgba(168, 30, 60, 0.4);
      }
      .mx-range::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #FFFFFF;
        border: 7px solid #A81E3C;
        box-shadow: 0 4px 14px rgba(168, 30, 60, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
