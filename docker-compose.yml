# 3Knot Matrimony on Cloudflare: backend + web containers plus a Cloudflare Tunnel, so the site is served on your
# Cloudflare domain over HTTPS without opening any ports on this machine.
#
#   backend      API, WebSocket and photos            (backend/Dockerfile, port 5000, internal only)
#   web          the web app on nginx; forwards /api, /uploads and /ws to backend   (web/Dockerfile, port 8080)
#   cloudflared  Cloudflare Tunnel → web
#
# 1. Cloudflare dashboard → Zero Trust → Networks → Tunnels → Create a tunnel (type: Cloudflared).
#    Copy its token. Add a Public Hostname, e.g. app.example.com → Service: HTTP, URL: web:8080
# 2. Copy .env.example to .env (next to this file) and fill in CLOUDFLARE_TUNNEL_TOKEN and PUBLIC_BASE_URL.
# 3. docker compose up -d --build
#
# The backend reads the rest of its settings (DATABASE_URL, SMS, payments…) from backend/.env.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: 3knot-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      # Photo URLs and family-portal links are built from this: it must be the public Cloudflare address
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env, e.g. https://app.example.com}
    volumes:
      - uploads:/app/backend/uploads
      - uploads-private:/app/backend/uploads-private

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: 3knot-web:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    # For checking on this machine only (http://localhost:5080); the tunnel is the public way in
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:8080"

  cloudflared:
    image: cloudflare/cloudflared:2025.4.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy

volumes:
  uploads:
  uploads-private:
